<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Prompt Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
        }

        .tts-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .tts-button:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .tts-button:active {
            transform: translateY(0);
        }

        .tts-button.speaking {
            background: rgba(255, 107, 107, 0.9);
            color: white;
        }

        .tts-button.loading {
            background: rgba(255, 193, 7, 0.9);
            color: white;
        }

        .speaker-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            max-height: 300px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .info-panel.visible {
            transform: translateY(0);
        }

        .info-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .info-content {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .error-message {
            color: #e74c3c;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <button class="tts-button" id="ttsButton">
        <svg class="speaker-icon" viewBox="0 0 24 24">
            <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zm-5.5-2.5L9 15l1.5-1.5L12 15l1.5-1.5L15 15l-1.5 1.5-.75-.75-.75.75zm0-3L9 12l1.5-1.5L12 12l1.5-1.5L15 12l-1.5 1.5-.75-.75-.75.75zm0-3L9 9l1.5-1.5L12 9l1.5-1.5L15 9l-1.5 1.5-.75-.75-.75.75z"/>
        </svg>
        Read Prompt
    </button>

    <script>
        class WebSimPromptReader {
            constructor() {
                this.button = document.getElementById('ttsButton');
                this.synth = window.speechSynthesis;
                this.currentUtterance = null;
                this.isSpeaking = false;
                this.textChunks = [];
                this.currentChunkIndex = 0;

                this.button.addEventListener('click', () => this.handleButtonClick());
            }

            async handleButtonClick() {
                if (this.isSpeaking) {
                    this.stopSpeaking();
                    return;
                }

                try {
                    this.setButtonState('loading', 'Loading...');
                    const promptData = await this.getCurrentPrompt();
                    
                    if (promptData) {
                        await this.speakPrompt(promptData.prompt);
                    } else {
                        throw new Error('No prompt found for current page');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    this.setButtonState('default', 'Read Prompt');
                }
            }

            async getCurrentPrompt() {
                try {
                    // Get current project info
                    const currentProject = await window.websim.getCurrentProject();
                    if (!currentProject) {
                        throw new Error('No current project found');
                    }

                    // Get project details with current version
                    const response = await fetch(`/api/v1/projects/${currentProject.id}`);
                    if (!response.ok) {
                        throw new Error('Failed to fetch project details');
                    }

                    const projectData = await response.json();
                    const site = projectData.site;
                    
                    if (!site || !site.prompt) {
                        throw new Error('No prompt found for this page');
                    }

                    // Extract prompt text based on prompt type
                    let promptText = '';
                    if (site.prompt && site.prompt.text) {
                        promptText = site.prompt.text;
                    } else if (typeof site.prompt === 'string') {
                        promptText = site.prompt;
                    } else {
                        throw new Error('Prompt format not recognized');
                    }

                    return {
                        projectId: currentProject.id,
                        title: currentProject.title || site.title || 'Untitled',
                        prompt: promptText,
                        promptType: site.prompt.type || 'unknown',
                        version: projectData.project_revision?.version || 'current',
                        url: window.location.href
                    };

                } catch (error) {
                    console.error('Error getting current prompt:', error);
                    throw error;
                }
            }

            splitTextIntoChunks(text, maxLength = 200) {
                if (text.length <= maxLength) {
                    return [text];
                }

                const chunks = [];
                const sentences = text.split(/([.!?]\s+)/);
                let currentChunk = '';

                for (let i = 0; i < sentences.length; i++) {
                    const sentence = sentences[i];
                    
                    // If adding this sentence would exceed the limit
                    if (currentChunk.length + sentence.length > maxLength) {
                        if (currentChunk.trim()) {
                            chunks.push(currentChunk.trim());
                            currentChunk = sentence;
                        } else {
                            // Single sentence is too long, split by line breaks
                            const lines = sentence.split(/\n+/);
                            for (const line of lines) {
                                if (line.trim()) {
                                    if (line.length > maxLength) {
                                        // Split by words if still too long
                                        const words = line.split(/\s+/);
                                        let wordChunk = '';
                                        for (const word of words) {
                                            if (wordChunk.length + word.length + 1 > maxLength) {
                                                if (wordChunk.trim()) {
                                                    chunks.push(wordChunk.trim());
                                                }
                                                wordChunk = word;
                                            } else {
                                                wordChunk += (wordChunk ? ' ' : '') + word;
                                            }
                                        }
                                        if (wordChunk.trim()) {
                                            chunks.push(wordChunk.trim());
                                        }
                                    } else {
                                        chunks.push(line.trim());
                                    }
                                }
                            }
                        }
                    } else {
                        currentChunk += sentence;
                    }
                }

                if (currentChunk.trim()) {
                    chunks.push(currentChunk.trim());
                }

                return chunks.filter(chunk => chunk.length > 0);
            }

            async speakPrompt(text) {
                return new Promise((resolve, reject) => {
                    if (!text || text.trim() === '') {
                        reject(new Error('No text to speak'));
                        return;
                    }

                    // Split text into manageable chunks
                    this.textChunks = this.splitTextIntoChunks(text);
                    this.currentChunkIndex = 0;

                    // Cancel any existing speech
                    this.synth.cancel();

                    this.speakNextChunk(resolve, reject);
                });
            }

            speakNextChunk(resolve, reject) {
                if (this.currentChunkIndex >= this.textChunks.length) {
                    this.isSpeaking = false;
                    this.setButtonState('default', 'Read Prompt');
                    resolve();
                    return;
                }

                const chunk = this.textChunks[this.currentChunkIndex];
                const utterance = new SpeechSynthesisUtterance(chunk);
                
                // Configure speech settings
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 0.8;

                // Set up event handlers
                utterance.onstart = () => {
                    this.isSpeaking = true;
                    const progress = `${this.currentChunkIndex + 1}/${this.textChunks.length}`;
                    this.setButtonState('speaking', `Stop (${progress})`);
                };

                utterance.onend = () => {
                    this.currentChunkIndex++;
                    // Small delay between chunks to prevent issues
                    setTimeout(() => {
                        this.speakNextChunk(resolve, reject);
                    }, 100);
                };

                utterance.onerror = (event) => {
                    this.isSpeaking = false;
                    this.setButtonState('default', 'Read Prompt');
                    reject(new Error(`Speech synthesis error: ${event.error}`));
                };

                this.currentUtterance = utterance;
                this.synth.speak(utterance);
            }

            stopSpeaking() {
                if (this.synth.speaking) {
                    this.synth.cancel();
                }
                this.isSpeaking = false;
                this.textChunks = [];
                this.currentChunkIndex = 0;
                this.setButtonState('default', 'Read Prompt');
            }

            setButtonState(state, text) {
                this.button.className = `tts-button ${state === 'default' ? '' : state}`;
                this.button.innerHTML = `
                    <svg class="speaker-icon" viewBox="0 0 24 24">
                        <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zm-5.5-2.5L9 15l1.5-1.5L12 15l1.5-1.5L15 15l-1.5 1.5-.75-.75-.75.75zm0-3L9 12l1.5-1.5L12 12l1.5-1.5L15 12l-1.5 1.5-.75-.75-.75.75zm0-3L9 9l1.5-1.5L12 9l1.5-1.5L15 9l-1.5 1.5-.75-.75-.75.75z"/>
                    </svg>
                    ${text}
                `;
            }
        }

        // Initialize the prompt reader when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new WebSimPromptReader();
        });

        // Handle page visibility changes to stop speech when tab is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
        });
    </script>

</body>
</html>
